services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ccdev
      POSTGRES_USER: ccdev
      POSTGRES_PASSWORD: ccdev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccdev -d ccdev"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ccdev
      DB_USER: ccdev
      DB_PASSWORD: ccdev
      # 默认手动调度（POST /api/scheduler/tick），保证验收确定性；
      # 需要持续自动调度时改为 "true"
      CLEARING_SCHEDULER_AUTO: "false"
      CLEARING_SCHEDULER_INTERVAL_MS: "3000"
    ports:
      - "8080:8080"

volumes:
  db-data:
